name: Notices check

# The installers ship THIRD-PARTY-NOTICES.txt, the license texts of the third-party code in the app:
# the Rust crates of the program, and the npm packages in the bundles of the UI and the built-in
# widgets. A change to the dependencies, or to the imports of the UI or a widget, can change that
# list. This check fails when the file in the commit no longer matches. `pnpm notices` writes it
# again.
on:
  pull_request:
    paths:
      - 'apps/ui/**'
      - 'widgets/**'
      - 'packages/sdk/**'
      - 'apps/desktop/Cargo.toml'
      - 'apps/desktop/Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/notices/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '.github/workflows/notices-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ui/**'
      - 'widgets/**'
      - 'packages/sdk/**'
      - 'apps/desktop/Cargo.toml'
      - 'apps/desktop/Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/notices/**'
      - 'THIRD-PARTY-NOTICES.txt'
      - '.github/workflows/notices-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: notices-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      # Nothing from this cache gets into an installer or a package. The release builds do not
      # use it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The script builds the UI and the widgets to see what they bundle. It reads the crates with
      # `cargo metadata` (the runner has Rust), which downloads their sources.
      - run: pnpm notices --check
