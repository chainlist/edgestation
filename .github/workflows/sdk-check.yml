name: SDK check

# Type-checks and tests the SDK (packages/sdk) when it changes, when the lockfile changes, or when
# the manifest of a built-in widget changes. The tests check each of these manifests against the
# manifest schema of the SDK. release.yml runs the same check and tests before it publishes the
# SDK, but only after the tag exists. This check finds the problem on the pull request.
on:
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'widgets/*/manifest.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk-check.yml'
  push:
    branches: [main]
    paths:
      - 'packages/sdk/**'
      - 'widgets/*/manifest.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sdk-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces the run in progress.
concurrency:
  group: sdk-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # Nothing from this cache gets into an installer or a package. The release builds do not
      # use it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The SDK only. It uses no other workspace package.
      - run: pnpm install --frozen-lockfile --filter @edgestation/sdk...
      - run: pnpm check
      - run: pnpm test
